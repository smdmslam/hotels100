<html lang="en">

<meta charset="UTF-8">
<title>Rate Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ink:#0D0E11;
  --panel:#15171C;
  --panel-2:#1B1E24;
  --line:#282B33;
  --brass-2:#C9A227;
  --brass-soft:#8F7B3D;
  --text:#E9E6DD;
  --text-dim:#948F82;
  --text-dimmer:#5E5B54;
  --up:#B5654A;
  --down:#5C8C6E;
  --radius:3px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;}
::selection{background:var(--brass-2);color:#0D0E11;}
h1,h2,h3,.serif{font-family:'Fraunces',serif;font-weight:500;letter-spacing:0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:var(--brass-2);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font-family:'Inter',sans-serif;cursor:pointer;}

.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:28px 0;}
.rail-head{padding:0 22px 22px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.rail-head .kicker{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--brass-soft);margin-bottom:6px;}
.rail-head h1{font-size:21px;margin:0;color:var(--text);}
.rail-head .sub{font-size:11px;color:var(--text-dimmer);margin-top:4px;}

.region-group{margin-top:18px;}
.region-group .glabel{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dimmer);padding:0 22px;margin-bottom:6px;}
.city-btn{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;color:var(--text-dim);padding:8px 22px;font-size:13px;text-align:left;border-left:2px solid transparent;transition:all .15s;}
.city-btn:hover{color:var(--text);background:var(--panel-2);}
.city-btn.active{color:var(--text);border-left-color:var(--brass-2);background:var(--panel-2);}
.city-btn .n{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dimmer);}

.main{padding:32px 40px 60px;max-width:1360px;}
.top-bar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;}
.top-bar .eyebrow{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--brass-soft);}
.top-bar h2{font-size:30px;margin:2px 0 0;}
.top-bar .loc-sub{color:var(--text-dim);font-size:12.5px;margin-top:3px;}
.transfer-strip{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}
.transfer-chip{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;font-size:12px;color:var(--text-dim);}
.transfer-chip b{color:var(--text);font-family:'IBM Plex Mono',monospace;font-weight:500;}

.seasonality-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin:26px 0;padding:20px 22px;}
.seasonality-card .sc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.seasonality-card h3{font-size:15px;margin:0;color:var(--text);}
.seasonality-card .legend{display:flex;gap:14px;font-size:11px;color:var(--text-dim);flex-wrap:wrap;}
.legend .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
#chart{width:100%;height:240px;display:block;}
.chart-empty{color:var(--text-dimmer);font-size:12.5px;padding:40px 0;text-align:center;}

.toggle-btn{background:none;border:1px solid var(--line);color:var(--text-dim);font-size:11px;padding:6px 12px;border-radius:var(--radius);}
.toggle-btn:hover{color:var(--brass-2);border-color:var(--brass-soft);}

.tier-mark{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block;}
.tier-primary{background:var(--brass-2);box-shadow:0 0 6px var(--brass-2);}
.tier-shadow{background:var(--text-dimmer);}
.spark{width:76px;height:22px;vertical-align:middle;}

.stack{display:flex;flex-direction:column;gap:22px;}
.cmp-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
.cmp-table{width:100%;min-width:760px;border-collapse:collapse;font-size:12px;}
.cmp-table th{text-align:left;color:var(--text-dimmer);font-weight:500;text-transform:uppercase;font-size:9.5px;letter-spacing:0.06em;padding:11px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;}
.cmp-table th:hover{color:var(--text-dim);}
.cmp-table th .arrow{opacity:0.4;font-size:9px;margin-left:2px;}
.cmp-table td{padding:10px;border-bottom:1px solid var(--line);color:var(--text-dim);vertical-align:middle;white-space:nowrap;}
.cmp-table tr{cursor:pointer;transition:background .12s;}
.cmp-table tbody tr:hover{background:var(--panel-2);}
.cmp-table tbody tr.sel{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--brass-2);}
.cmp-table td.asset{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13.5px;white-space:normal;min-width:150px;}
.cmp-table td.num{font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--text);font-size:11.5px;}
.cmp-table th.num{text-align:right;}
.vol{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid;}
.vol-low{color:var(--down);border-color:var(--down);}
.vol-medium{color:var(--brass-2);border-color:var(--brass-soft);}
.vol-high{color:var(--up);border-color:var(--up);}

.deepdive{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;}
.deepdive-head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px;}
.deepdive-head .dd-tier{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dimmer);margin-top:3px;}
.deepdive-head h3{font-size:22px;margin:0;color:var(--text);}
.dd-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start;}
.info-row{display:flex;gap:8px;font-size:12.5px;margin-bottom:7px;color:var(--text-dim);}
.info-row .k{width:70px;flex-shrink:0;color:var(--text-dimmer);text-transform:uppercase;font-size:10px;letter-spacing:0.08em;padding-top:2px;}
.info-row .v{color:var(--text);}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.tag{font-size:10.5px;padding:3px 9px;border:1px solid var(--line);border-radius:20px;color:var(--text-dim);}
.tag.on{color:var(--brass-2);border-color:var(--brass-soft);}
.res-links{display:flex;gap:10px;margin-top:14px;}
.res-links a{font-size:11.5px;border:1px solid var(--brass-soft);color:var(--brass-2);padding:6px 12px;border-radius:var(--radius);}

.notes textarea{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:12.5px;border-radius:var(--radius);padding:10px;min-height:56px;resize:vertical;}
.notes .nlabel{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dimmer);margin-bottom:6px;}

.pull-block{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.pull-btn{width:100%;background:none;border:1px solid var(--brass-soft);color:var(--brass-2);font-size:12px;padding:9px;border-radius:var(--radius);}
.pull-btn:hover{background:rgba(201,162,39,0.08);}
.pull-btn:disabled{opacity:0.5;cursor:wait;}
.pull-caption{font-size:10.5px;color:var(--text-dimmer);margin-top:6px;line-height:1.5;}
.ai-summary{margin-top:12px;background:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--text-dim);}
.ai-summary .aslabel{font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--brass-soft);margin-bottom:4px;}
.pull-error{font-size:11px;color:var(--up);margin-top:6px;}

.rate-block{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.rate-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:12px;}
.rate-form input,.rate-form select{background:var(--ink);border:1px solid var(--line);color:var(--text);font-size:12px;padding:7px 8px;border-radius:var(--radius);font-family:'IBM Plex Mono',monospace;}
.rate-form button{background:var(--brass-2);border:none;color:#15171C;font-weight:600;font-size:12px;padding:7px 12px;border-radius:var(--radius);}
.rate-table{width:100%;font-size:11.5px;border-collapse:collapse;}
.rate-table th{text-align:left;color:var(--text-dimmer);font-weight:500;text-transform:uppercase;font-size:9.5px;letter-spacing:0.06em;padding:5px 6px;border-bottom:1px solid var(--line);}
.rate-table td{padding:6px;border-bottom:1px solid var(--line);color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.rate-table td.stay{color:var(--text);font-family:'Inter',sans-serif;}
.del{color:var(--text-dimmer);cursor:pointer;font-size:11px;}
.del:hover{color:var(--up);}
.rate-empty{color:var(--text-dimmer);font-size:12px;padding:10px 0;}

.add-hotel{margin-top:22px;background:none;border:1px dashed var(--line);color:var(--text-dimmer);padding:12px;width:100%;border-radius:var(--radius);font-size:12px;}
.add-hotel:hover{color:var(--brass-2);border-color:var(--brass-soft);}
.save-tag{font-size:10px;color:var(--text-dimmer);position:fixed;bottom:14px;right:18px;font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .3s;}
.save-tag.show{opacity:1;}

.modal-backdrop{position:fixed;inset:0;background:rgba(9,10,12,0.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;width:520px;max-width:100%;max-height:88vh;overflow-y:auto;}
.modal h3{margin:0 0 3px;font-size:20px;color:var(--text);}
.modal .modal-sub{font-size:11px;color:var(--text-dimmer);margin-bottom:20px;text-transform:uppercase;letter-spacing:0.08em;}
.mfield{margin-bottom:14px;}
.mfield label{display:block;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dimmer);margin-bottom:6px;}
.mfield input,.mfield select{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--text);font-size:13px;padding:9px 10px;border-radius:var(--radius);font-family:'Inter',sans-serif;}
.mfield input:focus,.mfield select:focus{outline:none;border-color:var(--brass-soft);}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mtags{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px;}
.mtag{font-size:11.5px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;color:var(--text-dim);cursor:pointer;user-select:none;transition:all .12s;}
.mtag:hover{border-color:var(--text-dimmer);}
.mtag.on{color:var(--brass-2);border-color:var(--brass-soft);background:rgba(201,162,39,0.08);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.mbtn{padding:9px 16px;border-radius:var(--radius);font-size:12.5px;border:1px solid var(--line);background:none;color:var(--text-dim);}
.mbtn.primary{background:var(--brass-2);border:none;color:#15171C;font-weight:600;}
.mbtn:hover{border-color:var(--brass-soft);}
.mf-error{font-size:11px;color:var(--up);margin:-8px 0 12px;}
.mf-preview{font-size:10.5px;color:var(--down);margin-top:5px;font-family:'IBM Plex Mono',monospace;}
@media(max-width:820px){.app{grid-template-columns:1fr;}.rail{border-right:none;border-bottom:1px solid var(--line);}.dd-grid{grid-template-columns:1fr;}}
</style>
</head>

function monthBucketAverages(hotelIds){
  // returns { hotelId: [avg_by_month(0-11) or null] }
  const out = {};
  hotelIds.forEach(id=>{
    const buckets = Array.from({length:12},()=>[]);
    (state.rates[id]||[]).forEach(r=>{
      const m = new Date(r.stayDate+'T00:00:00').getMonth();
      if(!isNaN(m)) buckets[m].push(Number(r.rate));
    });
    out[id] = buckets.map(b=> b.length? b.reduce((a,x)=>a+x,0)/b.length : null);
  });
  return out;
}

function colorFor(id, city){
  const ids = allHotels(city).map(h=>hotelId(city,h.name));
  const ix = ids.indexOf(id);
  return CHART_COLORS[ix % CHART_COLORS.length];
}

const TENORS = [
  {key:'spot', label:'Spot', days:0},
  {key:'fwd1m', label:'1M', days:30},
  {key:'fwd3m', label:'3M', days:91},
  {key:'fwd6m', label:'6M', days:182},
  {key:'fwd9m', label:'9M', days:273},
  {key:'fwd12m', label:'12M', days:365},
];

function computeMetrics(id){
  const rates = (state.rates[id]||[]).slice();
  const values = {};
  TENORS.forEach(t=>values[t.key]=null);
  if(!rates.length) return {values, vol:null, count:0};
  const closest = (targetDate)=>{
    let best=null, bestDiff=Infinity;
    rates.forEach(r=>{
      const d = new Date(r.stayDate+'T00:00:00');
      const diff = Math.abs(d-targetDate);
      if(diff<bestDiff){ bestDiff=diff; best=r; }
    });
    return best;
  };
  const today = new Date();
  TENORS.forEach(t=>{
    const target = new Date(today); target.setDate(target.getDate()+t.days);
    values[t.key] = closest(target);
  });
  const vals = rates.map(r=>Number(r.rate));
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  const variance = vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length;
  const cv = mean ? Math.sqrt(variance)/mean*100 : 0;
  return {
    values,
    vol: rates.length<2 ? null : (cv<10?'Low':cv<25?'Medium':'High'),
    count: rates.length
  };
}

function sortedHotels(city){
  const hotels = allHotels(city).slice();
  const volRank = {Low:1,Medium:2,High:3};
  const dir = state.sortDir==='asc'?1:-1;
  const tenorKeys = TENORS.map(t=>t.key);
  hotels.sort((a,b)=>{
    const ida=hotelId(city,a.name), idb=hotelId(city,b.name);
    if(state.sortKey==='name') return a.name.localeCompare(b.name)*dir;
    const ma=computeMetrics(ida), mb=computeMetrics(idb);
    if(state.sortKey==='vol'){
      const va = ma.vol?volRank[ma.vol]:99, vb = mb.vol?volRank[mb.vol]:99;
      return (va-vb)*dir;
    }
    if(tenorKeys.includes(state.sortKey)){
      const va = ma.values[state.sortKey]?Number(ma.values[state.sortKey].rate):null;
      const vb = mb.values[state.sortKey]?Number(mb.values[state.sortKey].rate):null;
      if(va===null && vb===null) return 0;
      if(va===null) return 1;
      if(vb===null) return -1;
      return (va-vb)*dir;
    }
    return 0;
  });
  return hotels;
}

function niceStep(range, targetTicks){
  const rough = range / targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  const norm = rough / mag;
  let step;
  if(norm < 1.5) step = 1;
  else if(norm < 3) step = 2;
  else if(norm < 7) step = 5;
  else step = 10;
  return step * mag;
}

const CURRENCY_SYMBOL = {GBP:'£', EUR:'€', USD:'$', CHF:'CHF ', AED:'AED '};

function renderChart(city){
  const scopeHotels = allHotels(city).filter(h=> state.chartScope==='all' || h.tier==='primary');
  const hotels = scopeHotels;
  const ids = hotels.map(h=>hotelId(city,h.name));
  const data = monthBucketAverages(ids);
  const hasAny = Object.values(data).some(arr=>arr.some(v=>v!==null));
  const wrap = document.getElementById('chart-wrap');
  if(!hasAny){
    wrap.innerHTML = `<div class="chart-empty">No rate observations logged yet for ${cityLabel(city).label}. Add or pull a forward rate on any hotel to start building the seasonality curve.</div>`;
    document.getElementById('chart-legend').innerHTML = '';
    return;
  }
  const currencies = new Set(hotels.map(h=>h.currency));
  const currency = hotels.length ? hotels[0].currency : '';
  const symbol = CURRENCY_SYMBOL[currency] || (currency ? currency+' ' : '');
  const mixed = currencies.size > 1;

  const W=1100,H=240,padL=64,padR=14,padT=14,padB=30;
  const months=["J","F","M","A","M","J","J","A","S","O","N","D"];
  let allVals=[]; Object.values(data).forEach(arr=>arr.forEach(v=>{if(v!==null) allVals.push(v)}));
  const rawMin=Math.min(...allVals), rawMax=Math.max(...allVals);
  const step = niceStep(rawMax-rawMin || rawMax*0.2 || 1, 5);
  const min = Math.max(0, Math.floor((rawMin*0.92)/step)*step);
  const max = Math.ceil((rawMax*1.08)/step)*step;
  const x = i => padL + (i/11)*(W-padL-padR);
  const y = v => H-padB - ((v-min)/(max-min||1))*(H-padT-padB);

  let svg = `<svg id="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  // horizontal gridlines + price axis labels
  for(let v=min; v<=max+0.0001; v+=step){
    const yy = y(v);
    svg += `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#20232B" stroke-width="1"/>`;
    svg += `<text x="${padL-10}" y="${yy+3}" fill="#5E5B54" font-size="10" font-family="IBM Plex Mono" text-anchor="end">${symbol}${Math.round(v).toLocaleString()}</text>`;
  }
  // vertical month gridlines
  for(let i=0;i<12;i++){
    svg += `<line x1="${x(i)}" y1="${padT}" x2="${x(i)}" y2="${H-padB}" stroke="#282B33" stroke-width="1"/>`;
    svg += `<text x="${x(i)}" y="${H-10}" fill="#5E5B54" font-size="10" font-family="IBM Plex Mono" text-anchor="middle">${months[i]}</text>`;
  }
  let legend='';
  ids.forEach((id)=>{
    const arr = data[id];
    const color = colorFor(id, city);
    const pts = arr.map((v,i)=> v!==null? [x(i),y(v)] : null);
    // build path segments skipping nulls
    let path='', started=false;
    pts.forEach(p=>{
      if(p){ path += (started?'L':'M')+p[0]+','+p[1]+' '; started=true; }
      else{ started=false; }
    });
    svg += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>`;
    pts.forEach(p=>{ if(p) svg += `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${color}"/>`; });
    const hotel = hotels.find(h=>hotelId(city,h.name)===id);
    legend += `<span><span class="dot" style="background:${color}"></span>${hotel.name}</span>`;
  });
  svg += `</svg>`;
  wrap.innerHTML = svg;
  document.getElementById('chart-legend').innerHTML = legend + (mixed ? `<span style="color:var(--text-dimmer);">axis in ${currency} — mixed currencies in view</span>` : '');
}

function sparkline(hotelId,color){
  const arr = monthBucketAverages([hotelId])[hotelId];
  const vals = arr.map((v,i)=>v!==null?[i,v]:null).filter(Boolean);
  if(vals.length<2) return `<svg class="spark"></svg>`;
  const min=Math.min(...vals.map(v=>v[1])), max=Math.max(...vals.map(v=>v[1]));
  const W=90,H=26;
  const x=i=>2+(i/11)*(W-4);
  const y=v=> H-3 - ((v-min)/(max-min||1))*(H-6);
  let path=''; let started=false;
  arr.forEach((v,i)=>{ if(v!==null){ path+=(started?'L':'M')+x(i)+','+y(v)+' '; started=true;} else started=false; });
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><path d="${path}" fill="none" stroke="${color}" stroke-width="1.6"/></svg>`;
}

async function pullLiveRates(id, hotel){
  state.pulling = id;
  state.pullError = null;
  renderDeepDive();
  const prompt = `Search the web for recent or currently published nightly room rate information for "${hotel.name}" (${hotel.address}). Respond with ONLY a raw JSON object, no markdown fences, no commentary, matching exactly this shape: {"asOf":"YYYY-MM-DD","estimates":[{"stayDate":"YYYY-MM-DD","rate":number,"type":"Rack" or "Best Available","confidence":"low" or "medium" or "high"}],"notes":"one or two sentence summary of seasonal pattern or booking advice, plain text, no markdown"}. Include 9 to 12 estimates spread evenly across the next 12 months, including points near 1, 3, 6, 9 and 12 months out from today, and covering different seasons — do not cluster them in one season. Rates should be the nightly rate in ${hotel.currency} for a standard entry-level room, grounded in what you actually find online. If you cannot find a current rate, use the most recently published rate you can find and lower the confidence accordingly. Return JSON only, nothing else.`;
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
        tools: [{ type: "web_search_20250305", name: "web_search" }]
      })
    });
    const data = await res.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text);
    let raw = textBlocks.join('\n').trim();
    raw = raw.replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    const parsed = JSON.parse(raw);
    if(!state.rates[id]) state.rates[id]=[];
    (parsed.estimates||[]).forEach(e=>{
      if(!e.stayDate || !e.rate) return;
      state.rates[id].push({
        id: Date.now()+Math.random().toString(16).slice(2),
        stayDate: e.stayDate,
        rate: e.rate,
        type: (e.type||'Est.')+' · AI',
        confidence: e.confidence||'medium',
        checked: parsed.asOf || new Date().toISOString().slice(0,10)
      });
    });
    state.aiNotes[id] = { text: parsed.notes||'', asOf: parsed.asOf || new Date().toISOString().slice(0,10) };
    persist();
  }catch(e){
    console.error('live pull failed', e);
    state.pullError = id;
  }
  state.pulling = null;
  renderMain();
}

function wireMainEvents(){
  document.querySelectorAll('[data-row]').forEach(el=>{
    el.addEventListener('click',()=>{
      state.selectedHotel = el.dataset.row;
      renderMain();
    });
  });
  document.querySelectorAll('th[data-sort]').forEach(el=>{
    el.addEventListener('click',()=>{
      const key = el.dataset.sort;
      if(state.sortKey===key) state.sortDir = state.sortDir==='asc'?'desc':'asc';
      else { state.sortKey = key; state.sortDir='asc'; }
      renderMain();
    });
  });
  const scopeBtn = document.getElementById('scopeToggle');
  if(scopeBtn) scopeBtn.addEventListener('click',()=>{
    state.chartScope = state.chartScope==='all' ? 'primary' : 'all';
    renderMain();
  });
  const pullBtn = document.getElementById('pullBtn');
  if(pullBtn) pullBtn.addEventListener('click',()=>{
    const hotels = allHotels(state.city);
    const h = hotels.find(x=>hotelId(state.city,x.name)===state.selectedHotel);
    if(h) pullLiveRates(state.selectedHotel, h);
  });
  document.querySelectorAll('[data-addrate]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id = btn.dataset.addrate;
      const form = btn.closest('.rate-form');
      const stayDate = form.querySelector('[data-field="stayDate"]').value;
      const rate = form.querySelector('[data-field="rate"]').value;
      const type = form.querySelector('[data-field="type"]').value;
      if(!stayDate || !rate) return;
      if(!state.rates[id]) state.rates[id]=[];
      state.rates[id].push({id:Date.now()+Math.random().toString(16).slice(2), stayDate, rate, type, checked:new Date().toISOString().slice(0,10)});
      persist();
      renderMain();
    });
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click',(evt)=>{
      evt.stopPropagation();
      const hid = el.dataset.hotel, rid = el.dataset.del;
      state.rates[hid] = (state.rates[hid]||[]).filter(r=>r.id!==rid);
      persist();
      renderMain();
    });
  });
  document.querySelectorAll('[data-notes]').forEach(el=>{
    el.addEventListener('change',()=>{
      state.notes[el.dataset.notes] = el.value;
      persist();
    });
  });
  const addBtn = document.getElementById('addHotelBtn');
  if(addBtn) addBtn.addEventListener('click', openAddHotelModal);
}

  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <h3 class="serif">Add a hotel</h3>
        <div class="modal-sub">${cityLabel(state.city).label}</div>
        <div class="mfield"><label>Name</label><input id="mf-name" name="mf-name" autocomplete="off" placeholder="Hotel name"></div>
        <div id="mf-error"></div>
        <div class="mrow">
          <div class="mfield"><label>Tier</label>
            <select id="mf-tier" name="mf-tier"><option value="shadow">Shadow comp</option><option value="primary">Primary</option></select>
          </div>
          <div class="mfield"><label>Currency</label>
            <select id="mf-currency" name="mf-currency">${CURRENCY_OPTIONS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
          </div>
        </div>
        <div class="mfield"><label>Address</label><input id="mf-address" name="mf-address" autocomplete="off" placeholder="Street, city, postcode"></div>
        <div class="mrow">
          <div class="mfield"><label>Phone</label><input id="mf-phone" name="mf-phone" type="tel" autocomplete="off" placeholder="+44 20 ..."><div class="mf-preview" id="mf-phone-preview"></div></div>
          <div class="mfield"><label>Website URL</label><input id="mf-url" name="mf-url" type="text" autocomplete="off" placeholder="https://..."><div class="mf-preview" id="mf-url-preview"></div></div>
        </div>
        <div class="mfield"><label>Reservation URL</label><input id="mf-resurl" name="mf-resurl" type="text" autocomplete="off" placeholder="Leave blank to reuse the website URL"></div>
        <div class="mfield"><label>Amenities <span id="mf-amenities-count" class="mf-preview" style="display:inline;"></span></label>
          <div class="mtags" id="mf-amenities">${AMENITY_LIST.map(a=>`<span class="mtag" data-amenity="${a}">${a}</span>`).join('')}</div>
        </div>
        <div class="modal-actions">
          <button class="mbtn" id="mf-cancel" type="button">Cancel</button>
          <button class="mbtn primary" id="mf-save" type="button">Add hotel</button>
        </div>
      </div>
    </div>`;

  // Defensive: keep a live form-state object in sync via input events,
  // rather than only reading .value at save time.
  const form = { name:'', tier:'shadow', currency:'GBP', address:'', phone:'', url:'', resUrl:'', amenities:new Set() };

  const nameEl = root.querySelector('#mf-name');
  const tierEl = root.querySelector('#mf-tier');
  const currencyEl = root.querySelector('#mf-currency');
  const addressEl = root.querySelector('#mf-address');
  const phoneEl = root.querySelector('#mf-phone');
  const urlEl = root.querySelector('#mf-url');
  const resUrlEl = root.querySelector('#mf-resurl');
  const phonePreview = root.querySelector('#mf-phone-preview');
  const urlPreview = root.querySelector('#mf-url-preview');
  const amenCount = root.querySelector('#mf-amenities-count');

  nameEl.addEventListener('input', ()=>{ form.name = nameEl.value; });
  tierEl.addEventListener('change', ()=>{ form.tier = tierEl.value; });
  currencyEl.addEventListener('change', ()=>{ form.currency = currencyEl.value; });
  addressEl.addEventListener('input', ()=>{ form.address = addressEl.value; });
  phoneEl.addEventListener('input', ()=>{ form.phone = phoneEl.value; phonePreview.textContent = form.phone ? 'captured: '+form.phone : ''; });
  urlEl.addEventListener('input', ()=>{ form.url = urlEl.value; urlPreview.textContent = form.url ? 'captured: '+form.url : ''; });
  resUrlEl.addEventListener('input', ()=>{ form.resUrl = resUrlEl.value; });

  root.querySelectorAll('[data-amenity]').forEach(el=>{
    el.addEventListener('click',()=>{
      const a = el.dataset.amenity;
      if(form.amenities.has(a)){ form.amenities.delete(a); el.classList.remove('on'); }
      else{ form.amenities.add(a); el.classList.add('on'); }
      amenCount.textContent = form.amenities.size ? `${form.amenities.size} selected` : '';
    });
  });

  root.querySelector('#modalBackdrop').addEventListener('click',(e)=>{
    if(e.target.id==='modalBackdrop') closeModal();
  });
  root.querySelector('#mf-cancel').addEventListener('click', closeModal);
  nameEl.focus();

  root.querySelector('#mf-save').addEventListener('click',()=>{
    // Read directly from the inputs as a final source of truth, on top of the
    // live-bound form state, so nothing gets lost regardless of event timing.
    form.name = nameEl.value.trim();
    form.tier = tierEl.value;
    form.currency = currencyEl.value;
    form.address = addressEl.value.trim();
    form.phone = phoneEl.value.trim();
    form.url = urlEl.value.trim();
    form.resUrl = resUrlEl.value.trim() || form.url;

    if(!form.name){
      root.querySelector('#mf-error').innerHTML = `<div class="mf-error">Hotel name is required.</div>`;
      nameEl.focus();
      return;
    }
    if(!state.customHotels[state.city]) state.customHotels[state.city]=[];
    state.customHotels[state.city].push({
      name: form.name, tier: form.tier, address: form.address, phone: form.phone,
      url: form.url, resUrl: form.resUrl, amenities: Array.from(form.amenities), currency: form.currency
    });
    persist();
    closeModal();
    state.selectedHotel = hotelId(state.city, form.name);
    renderAll();
  });
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

function renderAll(){ renderRail(); renderMain(); }

loadAll().then(()=>{
  const first = allHotels(state.city)[0];
  state.selectedHotel = first ? hotelId(state.city, first.name) : null;
  renderAll();
});
</script>
</body>
</html>
